  <text x="1040" y="582" text-anchor="middle" fill="#321d00" font-family="Inter, system-ui" font-size="24" font-weight="1000" letter-spacing="3">WINNER</text>
  <text x="1040" y="625" text-anchor="middle" fill="#321d00" font-family="Inter, system-ui" font-size="34" font-weight="1000">Blue Builder</text>
