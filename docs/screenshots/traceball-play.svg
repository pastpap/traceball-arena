    <circle cx="515" cy="268" r="20"/><circle cx="589" cy="268" r="20"/><circle cx="663" cy="268" r="20"/><circle cx="515" cy="322" r="20"/><circle cx="663" cy="322" r="20"/><circle cx="515" cy="376" r="20"/><circle cx="589" cy="376" r="20"/><circle cx="663" cy="376" r="20"/>
