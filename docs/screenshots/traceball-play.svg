<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Traceball Arena gameplay board</title>
  <desc id="desc">Mock screenshot of Traceball Arena showing the pitch, colored legal move hints, jumping turn marker, replay controls, and match score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#03160a"/><stop offset=".5" stop-color="#074916"/><stop offset="1" stop-color="#021207"/></linearGradient>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0cb240"/><stop offset="1" stop-color="#03651e"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffe784"/><stop offset=".52" stop-color="#f6b92b"/><stop offset="1" stop-color="#b86c00"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="62" y="46" width="760" height="668" rx="30" fill="rgba(4,28,12,.84)" stroke="rgba(255,255,255,.18)" filter="url(#shadow)"/>
  <rect x="96" y="92" width="690" height="560" rx="26" fill="url(#field)"/>
  <g opacity=".18" transform="rotate(-28 441 372)"><rect x="-80" y="150" width="980" height="48" fill="#75ff8a"/><rect x="-80" y="270" width="980" height="48" fill="#004b12"/><rect x="-80" y="390" width="980" height="48" fill="#75ff8a"/><rect x="-80" y="510" width="980" height="48" fill="#004b12"/></g>
