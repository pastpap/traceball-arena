  <path d="M335 160V104H479V160M335 592V648H479V592" fill="none" stroke="#f8fff8" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#f5fff7" stroke-width="1" opacity=".8">
    <g id="points">
      <circle cx="144" cy="160" r="6"/><circle cx="218" cy="160" r="6"/><circle cx="292" cy="160" r="6"/><circle cx="366" cy="160" r="6"/><circle cx="441" cy="160" r="6"/><circle cx="515" cy="160" r="6"/><circle cx="589" cy="160" r="6"/><circle cx="663" cy="160" r="6"/><circle cx="738" cy="160" r="6"/>
      <circle cx="144" cy="376" r="6"/><circle cx="218" cy="376" r="6"/><circle cx="292" cy="376" r="6"/><circle cx="366" cy="376" r="10" fill="#0b7cff"/><circle cx="441" cy="376" r="10" fill="#0b7cff"/><circle cx="515" cy="376" r="10" fill="#0b7cff"/><circle cx="589" cy="376" r="6"/><circle cx="663" cy="376" r="6"/><circle cx="738" cy="376" r="6"/>
      <circle cx="144" cy="592" r="6"/><circle cx="218" cy="592" r="6"/><circle cx="292" cy="592" r="6"/><circle cx="366" cy="592" r="6"/><circle cx="441" cy="592" r="6"/><circle cx="515" cy="592" r="6"/><circle cx="589" cy="592" r="6"/><circle cx="663" cy="592" r="6"/><circle cx="738" cy="592" r="6"/>
    </g>
  </g>
