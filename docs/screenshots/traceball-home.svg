<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Traceball Arena home and invite flow</title>
  <desc id="desc">Mock screenshot of the Traceball Arena home screen with online and local game options, invite generation, QR code, and join flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#03160a"/><stop offset=".52" stop-color="#074916"/><stop offset="1" stop-color="#021207"/></linearGradient>
    <linearGradient id="primary" x1="0" x2="1"><stop stop-color="#11bf46"/><stop offset="1" stop-color="#0b7cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <g opacity=".18" transform="rotate(-28 640 380)">
    <rect x="-140" y="90" width="1800" height="70" fill="#75ff8a"/><rect x="-140" y="250" width="1800" height="70" fill="#004b12"/><rect x="-140" y="410" width="1800" height="70" fill="#75ff8a"/><rect x="-140" y="570" width="1800" height="70" fill="#004b12"/>
  </g>
  <text x="72" y="108" fill="#8dffae" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="4">NO-DB REALTIME FOOTBALL</text>
  <text x="70" y="180" fill="#f4fff6" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="950" letter-spacing="-6">Traceball Arena</text>
  <text x="74" y="225" fill="#b8d8be" font-family="Inter, system-ui, sans-serif" font-size="25">Generate a game, share the link or QR, then join when ready.</text>

  <rect x="72" y="270" width="540" height="380" rx="28" fill="rgba(4,28,12,.88)" stroke="rgba(255,255,255,.18)" filter="url(#shadow)"/>
  <text x="110" y="330" fill="#f4fff6" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="850">Online game</text>
  <text x="110" y="365" fill="#b8d8be" font-family="Inter, system-ui, sans-serif" font-size="20">Choose a name, then generate or join.</text>
  <rect x="110" y="392" width="440" height="58" rx="16" fill="rgba(0,0,0,.24)" stroke="rgba(255,255,255,.22)"/>
  <text x="132" y="428" fill="#f4fff6" font-family="Inter, system-ui, sans-serif" font-size="21">Stefan</text>
  <rect x="110" y="474" width="210" height="54" rx="27" fill="url(#primary)"/>
  <text x="151" y="508" fill="white" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="900">New game</text>
  <rect x="340" y="474" width="210" height="54" rx="27" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
  <text x="375" y="508" fill="#f4fff6" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800">Existing game</text>
  <rect x="110" y="552" width="180" height="58" rx="29" fill="url(#primary)"/>
  <text x="150" y="588" fill="white" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="900">Generate</text>
  <rect x="316" y="552" width="234" height="58" rx="29" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.22)"/>
  <text x="348" y="588" fill="#f4fff6" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="850">Join generated</text>

  <rect x="668" y="270" width="540" height="380" rx="28" fill="rgba(4,28,12,.88)" stroke="rgba(255,255,255,.18)" filter="url(#shadow)"/>
  <text x="706" y="330" fill="#f4fff6" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="850">Share invite</text>
  <rect x="706" y="365" width="148" height="148" rx="16" fill="white"/>
  <path d="M730 389h38v38h-38zM792 389h38v38h-38zM730 451h38v38h-38zM792 451h16v16h22v22h-38z" fill="#08210d"/>
  <rect x="884" y="372" width="278" height="58" rx="16" fill="rgba(0,0,0,.24)" stroke="rgba(255,255,255,.22)"/>
  <text x="905" y="408" fill="#b8d8be" font-family="Inter, system-ui, sans-serif" font-size="18">/room/W3bS9k_Q</text>
  <rect x="884" y="452" width="278" height="58" rx="29" fill="url(#primary)"/>
  <text x="955" y="488" fill="white" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="900">Copy invite</text>
  <text x="706" y="575" fill="#b8d8be" font-family="Inter, system-ui, sans-serif" font-size="22">Local same-screen PvP lives beside online rooms.</text>
</svg>
